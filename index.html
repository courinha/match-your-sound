:root {

  --prio-media: var(--amber);
}

  --text-label: 12px;
  --text-micro: 11px;
  --leading-display: 0.92;
  --leading-body: 1.55;
  --tracking-tight: -0.01em;
  --tracking-wide: 0.04em;
  --tracking-wider: 0.12em;
  --tracking-widest: 0.18em;
}

:root {
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --space-16: 64px;
  --radius-none: 0;
  --radius-pill: 999px;
  --border-thick: 2px;
  --duration-fast: 150ms; /* @kind other */
  --ease-standard: cubic-bezier(0.2, 0, 0, 1); /* @kind other */
}

<style>
body{margin:0;background:var(--cream);font-family:var(--font-body);color:var(--ink);text-transform:uppercase;min-height:100vh;display:flex;flex-direction:column}
:focus-visible{outline:3px solid var(--flame);outline-offset:2px}
button{-webkit-tap-highlight-color:transparent}
main{flex:1}
a{color:var(--flame)}a:hover{color:var(--ink)}
.pill{border-radius:999px;font-weight:800;letter-spacing:0.14em;display:inline-flex;align-items:center;gap:8px;transition:background var(--duration-fast) var(--ease-standard),color var(--duration-fast) var(--ease-standard),transform var(--duration-fast) var(--ease-standard)}
.filter{border:1px solid var(--ink);padding:5px 12px;font-size:11px;cursor:pointer;user-select:none;background:none;font-family:inherit;text-transform:inherit;min-height:30px;box-sizing:border-box}
.filter:hover,.filter.on{background:var(--ink);color:var(--cream)}
.filter:active{transform:scale(0.97)}
.hbtn{border:1px solid var(--cream);color:var(--cream);padding:9px 20px;font-size:13px;cursor:pointer;text-decoration:none;background:none;font-family:inherit;text-transform:inherit;min-height:44px;box-sizing:border-box;align-items:center}
.hbtn:hover{background:var(--cream);color:var(--ink)}
.hbtn.solid{background:var(--flame);border-color:var(--flame)}
.hbtn.solid:hover{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.card{border:1px solid var(--ink);background:var(--cream);padding:20px;display:flex;flex-direction:column;gap:12px;transition:transform var(--duration-fast) var(--ease-standard),box-shadow var(--duration-fast) var(--ease-standard),border-color var(--duration-fast) var(--ease-standard)}
.card:hover{border-color:var(--flame)}
.card:focus-visible{border-color:var(--flame)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.dot{width:10px;height:10px;border-radius:999px;display:inline-block;flex-shrink:0}
.prio{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:0.12em;flex-shrink:0}
.meta{font-size:12px;font-weight:700;letter-spacing:0.1em}
.tag{border:1px solid var(--ink);padding:4px 12px;font-size:12px;letter-spacing:0.1em}
.empty{border:1px dashed var(--ink);opacity:0.45;padding:32px 24px;text-align:center;font-size:13px;font-weight:800;letter-spacing:0.14em}
.colhead{border:1px solid var(--ink);padding:8px 18px;font-size:13px;letter-spacing:0.16em;align-self:flex-start}
select.estado{font-family:inherit;text-transform:inherit;font-size:12px;font-weight:800;letter-spacing:0.1em;border:1px solid var(--ink);background:var(--cream);padding:6px 10px;border-radius:999px;cursor:pointer}
.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--ink)}
.tbl th{background:var(--ink);color:var(--cream);font-size:11px;font-weight:800;letter-spacing:0.14em;padding:10px 12px;text-align:left;white-space:nowrap}
.tbl td{border-top:1px solid var(--ink);padding:0;font-size:13px;vertical-align:middle}
.tbl td input,.tbl td select{width:100%;box-sizing:border-box;border:0;background:transparent;font-family:inherit;font-size:13px;padding:9px 12px;text-transform:none}
.tbl td select{text-transform:uppercase;font-weight:700;font-size:12px;cursor:pointer}
.tbl td input:focus,.tbl td select:focus{outline:2px solid var(--flame);outline-offset:-2px;background:#fff}
.tbl tr.saved td{background:#e8f2e4;transition:background 1s}
.tbl .del{border:0;background:none;color:var(--flame);font-weight:800;cursor:pointer;padding:9px 12px;font-size:14px;font-family:inherit}
.tbl .del:hover{color:var(--ink)}
dialog{border:1px solid var(--ink);background:var(--cream);padding:36px;max-width:420px;width:90vw;text-transform:uppercase;font-family:var(--font-body);color:var(--ink)}
dialog::backdrop{background:rgba(17,17,16,0.7)}
dialog h2{margin:0 0 20px;font-size:20px;font-weight:800;letter-spacing:0.08em}
dialog label{display:block;font-size:12px;font-weight:800;letter-spacing:0.14em;margin:14px 0 6px}
dialog input,dialog select,dialog textarea{width:100%;box-sizing:border-box;border:1px solid var(--ink);background:#fff;padding:10px 12px;font-family:inherit;font-size:14px;text-transform:none;resize:vertical}
dialog .row{display:flex;gap:12px;margin-top:24px}
dialog button{flex:1;border:1px solid var(--ink);padding:12px;font-family:inherit;text-transform:inherit;font-weight:800;letter-spacing:0.12em;font-size:13px;cursor:pointer;border-radius:999px;background:none}
dialog button.go{background:var(--flame);border-color:var(--flame);color:var(--cream)}
dialog button.go:hover{background:var(--ink);border-color:var(--ink)}
.err{color:var(--flame);font-size:12px;font-weight:800;letter-spacing:0.08em;margin-top:12px;text-transform:none;display:none}
#banner{display:none;background:var(--flame);color:var(--cream);padding:14px 36px;font-size:12px;font-weight:800;letter-spacing:0.1em}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--cream);padding:12px 24px;font-size:12px;font-weight:800;letter-spacing:0.12em;border-radius:999px;transition:transform .25s var(--ease-standard);z-index:99;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
#qRecentes::placeholder{color:var(--cream);opacity:.55}#qRecentes::-webkit-search-cancel-button{filter:invert(1)}
section.drop{outline:2px dashed var(--flame);outline-offset:6px}
.card.dragging{opacity:.35}.card[draggable=true]{cursor:grab}.card[draggable=true]:active{cursor:grabbing}
.edf{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:16px 18px}
.edf label{display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:800;letter-spacing:0.16em}
.edf .full{grid-column:1/-1}
.edf input,.edf select,.edf textarea{border:1px solid var(--ink);background:#fff;padding:10px 12px;font-family:inherit;font-size:14px;font-weight:500;text-transform:none;letter-spacing:0;box-sizing:border-box;width:100%;resize:vertical;min-height:44px}
.edf select{text-transform:uppercase;font-weight:700;font-size:12px;letter-spacing:0.1em;cursor:pointer}
.edf input:focus,.edf select:focus,.edf textarea:focus{outline:2px solid var(--flame);outline-offset:-1px}
.edf .ttl{font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:0}
.bog summary{list-style:none;display:flex;align-items:center;gap:12px;cursor:pointer;min-height:44px;border-bottom:1px solid var(--ink);padding-bottom:10px}
.bog summary::-webkit-details-marker{display:none}
.bog .chev{font-size:14px;transition:transform var(--duration-fast) var(--ease-standard);transform:rotate(-90deg)}
.bog[open] .chev{transform:none}
.bog summary:hover .colhead{background:var(--ink);color:var(--cream)}
.cdate{margin-top:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:11px;font-weight:800;letter-spacing:0.16em;cursor:default}
.cdate span{opacity:0.6}
.cdate input{font-family:inherit;font-size:14px;font-weight:800;letter-spacing:0.04em;border:1px solid var(--ink);background:#fff;padding:6px 10px;min-height:36px;box-sizing:border-box;cursor:pointer}
.cdate input:focus{outline:2px solid var(--flame);outline-offset:-1px}
.card.risk{border-color:var(--flame);box-shadow:inset 0 0 0 1px var(--flame)}
#loading{padding:60px;text-align:center;font-size:13px;font-weight:800;letter-spacing:0.16em;opacity:0.5;grid-column:1/-1}
header img{height:32px;max-width:min(70vw,320px);object-fit:contain;object-position:left}
@media(max-width:720px){header{padding:18px 16px;gap:12px 16px}header img{height:30px}.filters{padding:18px 16px 0}main{padding:18px 16px 40px}footer{padding:30px 16px 38px}}
</style>
</head>

<script>
const SB_URL='https://rhkvsjrhzfgoavrecytb.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJoa3ZzanJoemZnb2F2cmVjeXRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5ODYyMTksImV4cCI6MjEwNDU2MjIxOX0.K2FaQXpTIEth04JI-OisCneTJD4QafVF38CKspbi89E';

const MARCAS={'Match Your Sound':'--brand-mys','Match Attack':'--brand-match-attack','Disquiet':'--brand-disquiet','MAR':'--brand-mar','Tambor':'--brand-tambor'};
const ESTADOS=[['por_fazer','Por fazer',null],['em_curso','Em curso','--estado-emcurso'],['em_revisao','Em revisão','--estado-revisao'],['entregue','Entregue','--estado-entregue']];
const MESES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
let pedidos=[],filtro='Todas',session=null,qRec='';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>{if(!d)return'';const t=new Date(d+'T00:00');return t.getDate()+' '+MESES[t.getMonth()]+' '+t.getFullYear()};
const dias=d=>{if(!d)return'';const n=Math.ceil((new Date(d+'T00:00')-new Date().setHours(0,0,0,0))/864e5);if(n<0)return'<span style="color:var(--flame);font-size:12px;letter-spacing:0.12em">· Atrasado</span>';if(n===0)return'<span style="color:var(--flame);font-size:12px;letter-spacing:0.12em">· Hoje</span>';if(n<=7)return`<span style="color:var(--flame);font-size:12px;letter-spacing:0.12em">· Em ${n} dia${n>1?'s':''}</span>`;return''};
function banner(msg){const b=document.getElementById('banner');b.style.display=msg?'block':'none';b.textContent=msg||''}
let toastT;function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800)}
async function load(){const{data,error}=await sb.from('pedidos').select('*').order('prazo',{ascending:true,nullsFirst:false});if(error){banner('Erro a carregar pedidos: '+error.message+' — confirma que a tabela "pedidos" existe.');pedidos=[]}else{banner('');pedidos=data;const dl=document.getElementById('artistas');if(dl)dl.innerHTML=[...new Set(pedidos.map(p=>p.artista).filter(Boolean))].sort().map(a=>`<option value="${esc(a)}"></option>`).join('')}render()}
function cutoff(){return new Date(Date.now()-7*864e5).toISOString().slice(0,10)}
function visiveis(){return pedidos.filter(p=>p.estado!=='arquivado'&&!(p.estado==='entregue'&&p.entregue_em&&p.entregue_em<=cutoff()))}
function recentes(){return pedidos.filter(p=>p.estado==='entregue'&&p.entregue_em&&p.entregue_em<=cutoff()).sort((a,b)=>String(b.entregue_em).localeCompare(String(a.entregue_em))||String(b.criado_em||'').localeCompare(String(a.criado_em||'')))}
function card(p){const risk=p.prazo&&!['entregue','arquivado'].includes(p.estado)&&Math.ceil((new Date(p.prazo+'T00:00')-new Date().setHours(0,0,0,0))/864e5)<=2;const admin=session?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px" onclick="event.stopPropagation()"><select class="estado" onchange="mudaEstado('${p.id}',this.value)">${ESTADOS.map(([v,l])=>`<option value="${v}"${p.estado===v?' selected':''}>${l}</option>`).join('')}<option value="arquivado"${p.estado==='arquivado'?' selected':''}>Arquivar</option></select></div>`:'';
const prio=p.prioridade?`<span class="prio"><span class="dot" style="width:12px;height:12px;background:var(--prio-${p.prioridade==='alta'?'alta':'media'})"></span>${p.prioridade==='alta'?'Alta':'Média'}</span>`:`<span class="dot" style="width:12px;height:12px;border:1px solid var(--ink);box-sizing:border-box"></span>`;
const assets=p.assets_url?`<a class="pill" href="${esc(p.assets_url)}" target="_blank" style="align-self:flex-start;background:var(--amber);border:1px solid var(--ink);padding:7px 16px;font-size:12px;letter-spacing:0.12em;color:var(--ink);text-decoration:none" onclick="event.stopPropagation()">Assets ↗</a>`:'';
return`<article class="card${risk?' risk':''}" style="cursor:pointer" tabindex="0"${session?` draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${p.id}');event.dataTransfer.effectAllowed='move';this.classList.add('dragging')" ondragend="this.classList.remove('dragging')"`:''} role="link" aria-label="${esc(p.titulo)}" onkeydown="if(event.key==='Enter')location.hash='#p/${p.id}'" onclick="location.hash='#p/${p.id}'"><div style="display:flex;gap:10px;align-items:flex-start;justify-content:space-between"><span class="pill tag"><span class="dot" style="background:var(${MARCAS[p.marca]||'--brand-mys'})"></span>${esc(p.marca)}</span>${prio}</div><div style="font-size:18px;font-weight:800;line-height:1.2">${esc(p.titulo)}</div>${p.artista?`<div class="meta" style="color:var(--flame)">${esc(p.artista)}</div>`:''}${p.tipo?`<div class="meta">${esc(p.tipo)}</div>`:''}${session?`<label class="cdate" onclick="event.stopPropagation()" onkeydown="event.stopPropagation()"><span>Prazo</span><input type="date" value="${esc(p.prazo)}" onchange="editCampo('${p.id}','prazo',this.value)">${['entregue','arquivado'].includes(p.estado)?'':dias(p.prazo)}</label>`:p.prazo?`<div style="font-size:14px;font-weight:800;letter-spacing:0.06em;margin-top:auto">${fmt(p.prazo)} ${['entregue','arquivado'].includes(p.estado)?'':dias(p.prazo)}</div>`:''}${assets}${admin}</article>`}
const route=()=>{const m=location.hash.match(/^#p\/(.+)$/);return m?m[1]:null};
const isBO=()=>location.hash==='#backoffice';
window.addEventListener('hashchange',()=>render());
function hdr(){document.getElementById('hdrActions').innerHTML=session?`<button class="pill hbtn solid" onclick="dlgNovo.showModal()">+ Novo pedido</button><a class="pill hbtn${isBO()?' solid':''}" href="${isBO()?'#':'#backoffice'}" style="${isBO()?'background:var(--amber);border-color:var(--amber);color:var(--ink)':''}">${isBO()?'← Quadro':'Tabela'}</a><button class="pill hbtn" onclick="sair()">Sair</button>`:`<button class="pill hbtn" onclick="dlgLogin.showModal()">Pro Access</button>`}
function editForm(p){const id=p.id,on=k=>`onchange="editCampo('${id}','${k}',this.value)"`;
return`<div class="edf">
<label class="full">Título<input class="ttl" value="${esc(p.titulo)}" ${on('titulo')}></label>
<label>Marca<select ${on('marca')}>${Object.keys(MARCAS).map(m=>`<option${m===p.marca?' selected':''}>${m}</option>`).join('')}</select></label>
<label>Estado<select ${on('estado')}>${ESTADOS.map(([v,l])=>`<option value="${v}"${p.estado===v?' selected':''}>${l}</option>`).join('')}<option value="arquivado"${p.estado==='arquivado'?' selected':''}>Arquivado</option></select></label>
<label>Artista<input list="artistas" value="${esc(p.artista)}" ${on('artista')}></label>
<label>Tipo<input value="${esc(p.tipo)}" placeholder="ex.: arte final, copy, vídeo" ${on('tipo')}></label>
<label>Prioridade<select ${on('prioridade')}><option value=""${!p.prioridade?' selected':''}>—</option><option value="alta"${p.prioridade==='alta'?' selected':''}>Alta</option><option value="media"${p.prioridade==='media'?' selected':''}>Média</option></select></label>
<label>Prazo<input type="date" value="${esc(p.prazo)}" ${on('prazo')}></label>
<label class="full">Descrição<textarea rows="5" placeholder="Briefing, notas, contexto…" ${on('descricao')}>${esc(p.descricao)}</textarea></label>
<label class="full">Link de assets<input type="url" value="${esc(p.assets_url)}" placeholder="https://…" ${on('assets_url')}></label>
</div>
<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--ink);padding-top:16px;font-size:11px;font-weight:700;letter-spacing:0.12em;opacity:0.6">Guarda automaticamente ao sair de cada campo${p.criado_em?' · Criado a '+fmt(String(p.criado_em).slice(0,10)):''}${p.entregue_em?' · Entregue a '+fmt(p.entregue_em):''}</div>
${p.assets_url?`<a class="pill" href="${esc(p.assets_url)}" target="_blank" style="align-self:flex-start;background:var(--amber);border:1px solid var(--ink);padding:10px 22px;font-size:13px;letter-spacing:0.12em;color:var(--ink);text-decoration:none">Abrir assets ↗</a>`:''}`}
function renderDetail(id){const p=pedidos.find(x=>String(x.id)===id);const b=document.getElementById('board');if(!p){b.innerHTML=`<div class="empty" style="grid-column:1/-1">Pedido não encontrado — <a href="#">voltar ao quadro</a></div>`;return}
const est=ESTADOS.find(e=>e[0]===p.estado)||[p.estado,p.estado==='arquivado'?'Arquivado':'—',null];const c=est[2];
b.innerHTML=`<div style="grid-column:1/-1;display:flex;flex-direction:column;gap:18px;max-width:820px">
<a href="#" style="align-self:flex-start;text-decoration:none;color:var(--ink);font-size:12px;font-weight:800;letter-spacing:0.14em;padding:8px 0;min-height:44px;display:inline-flex;align-items:center">← Voltar ao quadro</a>
<article class="card" style="gap:18px;padding:32px">
<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="pill tag"><span class="dot" style="background:var(${MARCAS[p.marca]||'--brand-mys'})"></span>${esc(p.marca)}</span><span class="pill" style="${c?`background:var(${c});border:1px solid var(${c});${p.estado==='entregue'?'color:var(--cream);':''}`:'border:1px solid var(--ink);'}padding:4px 14px;font-size:12px;letter-spacing:0.14em">${est[1]}</span>${p.prioridade?`<span class="prio"><span class="dot" style="width:12px;height:12px;background:var(--prio-${p.prioridade==='alta'?'alta':'media'})"></span>${p.prioridade==='alta'?'Alta':'Média'}</span>`:''}</div>
${session?editForm(p):`<h1 style="margin:0;font-size:30px;font-weight:800;line-height:1.1">${esc(p.titulo)}</h1>
${p.artista?`<div class="meta" style="color:var(--flame)">${esc(p.artista)}</div>`:''}
${p.tipo?`<div class="meta">${esc(p.tipo)}</div>`:''}
<div style="display:flex;gap:32px;flex-wrap:wrap">${p.prazo?`<div><div style="font-size:11px;font-weight:800;letter-spacing:0.16em;opacity:0.6">Prazo</div><div style="font-size:15px;font-weight:800">${fmt(p.prazo)} ${['entregue','arquivado'].includes(p.estado)?'':dias(p.prazo)}</div></div>`:''}${p.entregue_em?`<div><div style="font-size:11px;font-weight:800;letter-spacing:0.16em;opacity:0.6">Entregue</div><div style="font-size:15px;font-weight:800">${fmt(p.entregue_em)}</div></div>`:''}${p.criado_em?`<div><div style="font-size:11px;font-weight:800;letter-spacing:0.16em;opacity:0.6">Criado</div><div style="font-size:15px;font-weight:800">${fmt(String(p.criado_em).slice(0,10))}</div></div>`:''}</div>
${p.descricao?`<p style="margin:0;text-transform:none;font-size:15px;line-height:1.6;letter-spacing:0">${esc(p.descricao)}</p>`:''}
${p.assets_url?`<a class="pill" href="${esc(p.assets_url)}" target="_blank" style="align-self:flex-start;background:var(--amber);border:1px solid var(--ink);padding:10px 22px;font-size:13px;letter-spacing:0.12em;color:var(--ink);text-decoration:none">Abrir assets ↗</a>`:''}
`}${false?`<div style="display:flex;gap:10px;align-items:center;border-top:1px solid var(--ink);padding-top:16px"><span style="font-size:11px;font-weight:800;letter-spacing:0.16em;opacity:0.6">Estado</span><select class="estado" onchange="mudaEstado('${p.id}',this.value)">${ESTADOS.map(([v,l])=>`<option value="${v}"${p.estado===v?' selected':''}>${l}</option>`).join('')}<option value="arquivado"${p.estado==='arquivado'?' selected':''}>Arquivar</option></select></div>`:''}
</article></div>`}
const CAMPOS=[['titulo','Título','text'],['marca','Marca','select-marca'],['artista','Artista','text'],['tipo','Tipo','text'],['prioridade','Prio','select-prio'],['estado','Estado','select-estado'],['prazo','Prazo','date'],['entregue_em','Entregue','date'],['assets_url','Assets','url']];
function cell(p,k,kind){const v=p[k]??'';if(kind==='select-marca')return`<select onchange="editCampo('${p.id}','${k}',this.value)">${Object.keys(MARCAS).map(m=>`<option${m===v?' selected':''}>${m}</option>`).join('')}</select>`;
if(kind==='select-prio')return`<select onchange="editCampo('${p.id}','${k}',this.value)"><option value=""${!v?' selected':''}>—</option><option value="alta"${v==='alta'?' selected':''}>Alta</option><option value="media"${v==='media'?' selected':''}>Média</option></select>`;
if(kind==='select-estado')return`<select onchange="editCampo('${p.id}','${k}',this.value)">${ESTADOS.map(([ev,l])=>`<option value="${ev}"${ev===v?' selected':''}>${l}</option>`).join('')}<option value="arquivado"${v==='arquivado'?' selected':''}>Arquivado</option></select>`;
return`<input type="${kind}" value="${esc(v)}" onchange="editCampo('${p.id}','${k}',this.value)">`}
let boOpen={rec:false,arq:false};
const COLW=['22%','12%','11%','10%','7%','10%','9%','9%','8%','42px'];
function boTable(list,extra){return`<div style="overflow-x:auto"><table class="tbl" style="table-layout:fixed;min-width:1100px"><colgroup>${COLW.map(w=>`<col style="width:${w}">`).join('')}</colgroup><thead><tr>${CAMPOS.map(([,l])=>`<th>${l}</th>`).join('')}<th></th></tr></thead><tbody>
${list.map(p=>`<tr id="r-${p.id}">${CAMPOS.map(([k,,kind])=>`<td>${cell(p,k,kind)}</td>`).join('')}<td><button class="del" title="Apagar" onclick="apagar('${p.id}')">×</button></td></tr>`).join('')}
${list.length?'':`<tr><td colspan="${CAMPOS.length+1}" style="padding:16px;text-align:center;font-size:12px;font-weight:800;letter-spacing:0.14em;opacity:0.45">Sem pedidos</td></tr>`}${extra||''}
</tbody></table></div>`}
function boGroup(key,label,list){return`<details class="bog" ${boOpen[key]?'open':''} ontoggle="boOpen['${key}']=this.open"><summary><span class="pill colhead" style="pointer-events:none">${label} · ${list.length}</span><span class="chev" aria-hidden="true">▾</span></summary><div style="margin-top:12px">${boTable(list)}</div></details>`}
function renderBO(){const b=document.getElementById('board');const ord=Object.fromEntries(ESTADOS.map(([v],i)=>[v,i]));const rec=recentes();const recIds=new Set(rec.map(p=>p.id));
const ativos=pedidos.filter(p=>p.estado!=='arquivado'&&!recIds.has(p.id)).sort((x,y)=>(ord[x.estado??'por_fazer']??0)-(ord[y.estado??'por_fazer']??0)||String(x.prazo||'9999').localeCompare(String(y.prazo||'9999')));
const arq=pedidos.filter(p=>p.estado==='arquivado').sort((x,y)=>String(y.entregue_em||y.prazo||'').localeCompare(String(x.entregue_em||x.prazo||'')));
const add=`<tr><td colspan="${CAMPOS.length+1}" style="padding:0"><button style="width:100%;border:0;background:none;font-family:inherit;text-transform:uppercase;font-weight:800;font-size:12px;letter-spacing:0.14em;padding:12px;cursor:pointer;color:var(--flame)" onclick="novaLinha()">+ Adicionar linha</button></td></tr>`;
b.innerHTML=`<div style="grid-column:1/-1;display:flex;flex-direction:column;gap:22px">
<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><span class="pill colhead" style="background:var(--ink);color:var(--cream)">Em aberto · ${ativos.length}</span><span style="font-size:11px;font-weight:700;letter-spacing:0.12em;opacity:0.6">Ordenado por estado e prazo — edita direto na tabela, guarda ao sair do campo</span></div>
${boTable(ativos,add)}
${boGroup('rec','Entregas recentes',rec)}
${boGroup('arq','Arquivados',arq)}
</div>`}
window.editCampo=async(id,k,v)=>{const upd={[k]:v===''?null:v};if(k==='estado'){if(v==='entregue')upd.entregue_em=new Date().toISOString().slice(0,10);else if(v!=='arquivado')upd.entregue_em=null}
const{error}=await sb.from('pedidos').update(upd).eq('id',id);if(error){banner('Erro a guardar: '+error.message);return}banner('');toast('Guardado ✓');const p=pedidos.find(x=>String(x.id)===String(id));if(p)Object.assign(p,upd);if(!route()&&!isBO()&&k==='prazo')render();if(route()&&['estado','marca','prioridade'].includes(k))renderDetail(route());const r=document.getElementById('r-'+id);if(r){r.classList.add('saved');setTimeout(()=>r.classList.remove('saved'),900)}};
window.apagar=async id=>{if(!confirm('Apagar este pedido de vez? (para tirar do quadro basta "Arquivado")'))return;const{error}=await sb.from('pedidos').delete().eq('id',id);if(error){banner('Erro a apagar: '+error.message);return}toast('Pedido apagado');pedidos=pedidos.filter(p=>String(p.id)!==String(id));renderBO()};
window.novaLinha=async()=>{const{data,error}=await sb.from('pedidos').insert({titulo:'Novo pedido',marca:'Match Your Sound'}).select().single();if(error){banner('Erro a criar: '+error.message);return}pedidos.push(data);renderBO();const r=document.getElementById('r-'+data.id);if(r){const inp=r.querySelector('input');if(inp){inp.focus();inp.select()}}};
function render(){hdr();if(isBO()&&session){document.querySelector('.filters').style.display='none';document.querySelector('footer').style.display='none';renderBO();return}const id=route();document.querySelector('.filters').style.display=id?'none':'flex';document.querySelector('footer').style.display=id?'none':'flex';if(id){renderDetail(id);return}const vis=visiveis();const doFiltro=l=>l.filter(p=>filtro==='Todas'||p.marca===filtro);
const counts={Todas:vis.length};for(const m of Object.keys(MARCAS))counts[m]=vis.filter(p=>p.marca===m).length;
document.getElementById('filters').innerHTML=[['Todas','--flame'],...Object.entries(MARCAS)].map(([m,v])=>counts[m]?`<button class="pill filter${filtro===m?' on':''}" onclick="setFiltro('${m}')"><span class="dot" style="background:var(${v})"></span>${m} · ${counts[m]}</button>`:'').join('');
document.getElementById('board').innerHTML=ESTADOS.map(([v,l,c])=>{let items=doFiltro(vis.filter(p=>p.estado===v));if(v==='entregue')items=[...items].sort((x,y)=>String(y.entregue_em||'').localeCompare(String(x.entregue_em||''))||String(y.criado_em||'').localeCompare(String(x.criado_em||'')));const head=`<span class="pill colhead" style="${c?`background:var(${c});border-color:var(${c});${v==='entregue'?'color:var(--cream);':''}`:''}">${l} · ${items.length}</span>`;return`<section style="display:flex;flex-direction:column;gap:12px;min-height:120px"${session?` ondragover="dragOver(event)" ondragleave="if(!this.contains(event.relatedTarget))this.classList.remove('drop')" ondrop="dropEm(event,'${v}')"`:''}>${head}${items.length?items.map(card).join(''):'<div class="empty">Sem pedidos</div>'}</section>`}).join('');
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();const qn=norm(qRec.trim());const rec=doFiltro(recentes()).filter(p=>!qn||norm([p.titulo,p.marca,p.artista,p.tipo,p.descricao,fmt(p.entregue_em)].join(' ')).includes(qn));document.getElementById('recentes').innerHTML=rec.length?rec.map(p=>`<div style="border:1px solid var(--cream);padding:28px;display:flex;flex-direction:column;gap:16px;cursor:pointer" onclick="location.hash='#p/${p.id}'"><div style="color:var(--cream);font-size:16px;font-weight:800;line-height:1.25">${esc(p.titulo)}</div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span style="color:var(--cream);font-size:12px;font-weight:800;letter-spacing:0.1em;display:inline-flex;align-items:center;gap:6px"><span class="dot" style="background:var(${MARCAS[p.marca]||'--brand-mys'})"></span>${esc(p.marca)}</span><span style="color:var(--amber);font-size:12px;font-weight:800;letter-spacing:0.1em">Entregue a ${fmt(p.entregue_em)}</span>${p.assets_url?`<a href="${esc(p.assets_url)}" target="_blank" style="color:var(--amber);font-size:12px;font-weight:800;letter-spacing:0.1em" onclick="event.stopPropagation()">Assets ↗</a>`:''}</div></div>`).join(''):`<div style="border:1px dashed var(--cream);opacity:0.45;color:var(--cream);padding:28px;text-align:center;font-size:13px;font-weight:800;letter-spacing:0.14em">${qn?'Sem resultados para “'+esc(qRec.trim())+'”':'Ainda sem entregas arquivadas'}</div>`;}
window.setFiltro=m=>{filtro=m;render()};
window.dragOver=e=>{if(!session)return;e.preventDefault();e.dataTransfer.dropEffect='move';e.currentTarget.classList.add('drop')};
window.dropEm=(e,estado)=>{e.preventDefault();e.currentTarget.classList.remove('drop');const id=e.dataTransfer.getData('text/plain');const p=pedidos.find(x=>String(x.id)===id);if(!p||p.estado===estado)return;p.estado=estado;p.entregue_em=estado==='entregue'?new Date().toISOString().slice(0,10):null;render();mudaEstado(id,estado)};
document.getElementById('qRecentes').addEventListener('input',e=>{qRec=e.target.value;render()});
window.mudaEstado=async(id,estado)=>{const upd={estado};if(estado==='entregue')upd.entregue_em=new Date().toISOString().slice(0,10);else upd.entregue_em=null;const{error}=await sb.from('pedidos').update(upd).eq('id',id);if(error)banner('Erro a atualizar: '+error.message);else toast('Estado atualizado ✓');load()};
window.sair=async()=>{await sb.auth.signOut();location.hash=''};
document.getElementById('frmLogin').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const{error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});const el=document.getElementById('loginErr');if(error){el.style.display='block';el.textContent='Login falhou: '+error.message}else{el.style.display='none';dlgLogin.close();e.target.reset()}});
document.getElementById('frmNovo').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const rec={titulo:f.get('titulo'),marca:f.get('marca'),artista:f.get('artista')||null,tipo:f.get('tipo')||null,prioridade:f.get('prioridade')||null,prazo:f.get('prazo')||null,assets_url:f.get('assets_url')||null};if(f.get('descricao'))rec.descricao=f.get('descricao');const{error}=await sb.from('pedidos').insert(rec);const el=document.getElementById('novoErr');if(error){el.style.display='block';el.textContent='Erro: '+error.message}else{el.style.display='none';dlgNovo.close();e.target.reset();toast('Pedido criado ✓');load()}});
sb.auth.onAuthStateChange((_e,s)=>{session=s;render()});
sb.auth.getSession().then(({data})=>{session=data.session;load()});
</script>


</body></html>
